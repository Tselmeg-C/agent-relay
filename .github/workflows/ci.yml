name: CI

on:
  push:
  workflow_dispatch:

env:
  IMAGE_NAME: agent-relay
  KIND_CLUSTER: agent-relay

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync

      - name: Run starter test suite (SQLite)
        run: uv run pytest test_agent_relay.py -v

      - name: Start PostgreSQL container
        run: |
          docker rm -f ci-postgres >/dev/null 2>&1 || true
          docker run -d --name ci-postgres --network host \
            -e POSTGRES_USER=agent_relay -e POSTGRES_PASSWORD=agent_relay -e POSTGRES_DB=agent_relay \
            -e PGPORT=55432 postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec ci-postgres pg_isready -U agent_relay -p 55432 && break
            sleep 1
          done

      - name: Start Agent Relay against PostgreSQL
        env:
          RELAY_DATABASE_URL: postgresql+psycopg://agent_relay:agent_relay@127.0.0.1:55432/agent_relay
        run: |
          nohup uv run uvicorn main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          echo $! > uvicorn.pid
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/ready && break; sleep 1; done

      - name: Run PostgreSQL integration test
        env:
          RELAY_BASE_URL: http://127.0.0.1:8000
        run: uv run pytest test_live_scenario.py -v

      - name: Stop Agent Relay and PostgreSQL
        if: always()
        run: |
          kill "$(cat uvicorn.pid)" 2>/dev/null || true
          docker rm -f ci-postgres >/dev/null 2>&1 || true

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: image
        run: echo "tag=$(git rev-parse --short HEAD)-$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: docker build -t "$IMAGE_NAME:${{ steps.image.outputs.tag }}" .

      - name: Ensure kind cluster exists
        run: kind get clusters | grep -qx "$KIND_CLUSTER" || kind create cluster --name "$KIND_CLUSTER"

      - name: Load image into kind
        run: kind load docker-image "$IMAGE_NAME:${{ steps.image.outputs.tag }}" --name "$KIND_CLUSTER"

      - name: Apply manifests
        run: kubectl apply -f k8s/postgres.yaml -f k8s/agent-relay.yaml

      - name: Deploy new image
        run: kubectl set image deployment/agent-relay agent-relay="$IMAGE_NAME:${{ steps.image.outputs.tag }}"

      - name: Wait for rollout
        run: kubectl rollout status deployment/agent-relay --timeout=300s
